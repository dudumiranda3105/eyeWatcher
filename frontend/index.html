<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="eyeWatcher — monitoramento AIoT de salas de servidores em tempo real."
    />
    <title>eyeWatcher</title>
    <script>
      // Aplica o tema antes da primeira pintura, para a tela nao piscar.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem("eyewatcher.theme")
        } catch (error) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
