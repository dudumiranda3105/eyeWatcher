# eyeWatcher — broker MQTT de borda.
# Sem acesso anonimo: usuario por cliente (senhas geradas no bootstrap) e
# permissao por topico no arquivo acl.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
connection_messages true

max_queued_messages 1000
max_keepalive 120
