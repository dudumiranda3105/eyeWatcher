# ============================================================================
# eyeWatcher — configuração do broker Mosquitto 2.x
# ----------------------------------------------------------------------------
# Este arquivo é usado nos DOIS caminhos de execução:
#
#   1) Docker  -> montado em /mosquitto/config/mosquitto.conf (infra/docker-compose.yml)
#   2) Windows -> copiado para o diretório de instalação pelo script
#                 scripts/install-windows.ps1, que reescreve automaticamente
#                 os caminhos de persistência/log abaixo para caminhos Windows.
#
# Portas conforme docs/CONTRACT.md seção 7.
# ============================================================================

# ----------------------------------------------------------------------------
# Listener MQTT sobre TCP — usado pelo ESP32 (Wokwi) e pelo backend Python
# ----------------------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# ----------------------------------------------------------------------------
# Listener MQTT sobre WebSocket — permite assinar os tópicos direto do
# navegador (útil para depurar a telemetria durante a apresentação).
# ----------------------------------------------------------------------------
listener 9001 0.0.0.0
protocol websockets

# ----------------------------------------------------------------------------
# AUTENTICAÇÃO
# ----------------------------------------------------------------------------
# allow_anonymous true libera qualquer cliente a publicar e assinar SEM
# usuário e senha.
#
# Isso é ACEITÁVEL APENAS EM AMBIENTE DE LABORATÓRIO / APRESENTAÇÃO, em rede
# local e confiável, como é o caso deste projeto acadêmico: o ESP32 é um
# simulador no Wokwi e o broker roda na própria máquina do desenvolvedor.
#
# EM PRODUÇÃO ISSO É INACEITÁVEL: qualquer um na rede poderia injetar
# telemetria falsa ou ler os dados do rack. Para endurecer, troque as duas
# linhas abaixo e gere um arquivo de senhas (veja o README desta pasta):
#
#   allow_anonymous false
#   password_file /mosquitto/config/passwd      # Docker
#   #password_file C:\Program Files\mosquitto\config\passwd   # Windows nativo
#
# ...e, opcionalmente, uma ACL restringindo cada cliente ao seu tópico:
#
#   #acl_file /mosquitto/config/acl
#
# Depois disso, firmware e backend precisam enviar usuário/senha
# (MQTT_USERNAME / MQTT_PASSWORD).
allow_anonymous true

# ----------------------------------------------------------------------------
# PERSISTÊNCIA
# ----------------------------------------------------------------------------
# Mantém mensagens retidas (o tópico `eyewatcher/<rack_id>/status` é retain=true
# no contrato) e as sessões QoS 1 entre reinícios do broker.
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
# Grava o arquivo de persistência no disco a cada 60s.
autosave_interval 60

# ----------------------------------------------------------------------------
# LOG
# ----------------------------------------------------------------------------
# Em arquivo (para investigar depois) e no stdout (para ver ao vivo no console
# ou em `docker compose logs -f mosquitto`).
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
# Registra cada conexão/desconexão — ajuda a provar que o ESP32 conectou.
connection_messages true

# ----------------------------------------------------------------------------
# LIMITES
# ----------------------------------------------------------------------------
# O projeto publica 1 mensagem a cada 5s por rack: os padrões são folgados,
# mas deixamos explícito para facilitar o ajuste.
max_queued_messages 1000
max_keepalive 120
