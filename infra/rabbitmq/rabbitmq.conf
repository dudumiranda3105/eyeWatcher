# A topologia e os usuarios vem do definitions.json gerado no bootstrap. Com
# usuarios nas definicoes, o RabbitMQ nao cria o guest.
load_definitions = /etc/rabbitmq/eyewatcher/definitions.json
password_hashing_module = rabbit_password_hashing_sha256
vm_memory_high_watermark.relative = 0.4
# Estatisticas a cada 2 s (o padrao e 5 s): a pagina Mensageria fica mais viva.
collect_statistics_interval = 2000
