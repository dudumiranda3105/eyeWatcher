# Configuração de qualidade do backend do eyeWatcher.
# Uso:  ruff check .   |   ruff format --check .   |   pytest

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# E501 fica a cargo do formatter; comentários longos em português são aceitáveis.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
